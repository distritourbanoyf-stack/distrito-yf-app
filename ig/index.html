<script>
// QR de la tarjeta: cuenta un escaneo (solo el tipo, nada personal) y manda a Instagram.
// Si cambia el usuario de Instagram, se cambia acá y no hay que reimprimir la tarjeta.
(function () {
  var IG = 'https://www.instagram.com/distritoyf/';
  var ir = function () { location.replace(IG); };
  try {
    fetch('https://bhtwuunoxkwesnjombuw.supabase.co/rest/v1/catalogo_eventos', {
      method: 'POST', keepalive: true,
      headers: { apikey: 'sb_publishable__emijvBRay1vB4dTazgcew_EQoEa_U9', 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ tipo: 'qr_tarjeta', modelo_id: null })
    }).then(ir, ir);
  } catch (e) { ir(); }
  setTimeout(ir, 1200);
})();
</script>
